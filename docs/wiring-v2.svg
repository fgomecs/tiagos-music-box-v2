<rect x="60" y="870" width="920" height="134" rx="6" fill="#fffbe6" stroke="#c9b458" stroke-width="1.5" />
<text x="72" y="892" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#5a4a00" text-anchor="start" font-weight="bold">Notes</text>
<text x="72" y="916" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="normal">• Display overlay (setup.sh): dtoverlay=vc4-kms-dsi-waveshare-panel,4_3_inch in /boot/firmware/config.txt</text>
<text x="72" y="936" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="normal">• Camera: picamera2, opened only on the Camera screen to save battery. Photos → ~/Pictures/kidbox</text>
<text x="72" y="956" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="normal">• The screen gets power from the header (5V pin 2, GND pin 6); video + touch go over the DSI ribbon.</text>
<text x="72" y="976" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="normal">• No GPIO buttons in V2: everything is touch. Free GPIO pins are left for future add-ons.</text>
<text x="72" y="996" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#333" text-anchor="start" font-weight="normal">• Ribbons: blue/contact side matters. DSI and CSI latches must be fully closed or nothing shows.</text>
